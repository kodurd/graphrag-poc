# Единый конфиг PoC. Секреты — в .env (см. .env.example), не здесь.

llm:
  # provider: api | ollama  (взаимозаменяемы)
  provider: api
  generation_model: gpt-4o-mini
  extraction_model: gpt-4o-mini
  api_base: https://api.openai.com/v1
  ollama_base: http://localhost:11434
  max_retries: 2
  temperature: 0.0

embeddings:
  # provider: sentence_transformers | hashing (оффлайн/тесты)
  provider: sentence_transformers
  model: BAAI/bge-m3
  dimension: 1024
  device: cpu

reranker:
  # provider: cross_encoder | lexical (оффлайн/тесты)
  provider: cross_encoder
  model: BAAI/bge-reranker-v2-m3

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  database: neo4j

corpus:
  # Ограниченный срез Kafka
  repo_path: ./data/repos/kafka
  components: [clients, connect, streams]
  since: "2024-01-01"

sources:
  jira_base: https://issues.apache.org/jira
  jira_project: KAFKA
  confluence_base: https://cwiki.apache.org/confluence
  confluence_space: KAFKA
  max_issues: 500
  max_pages: 500
  # Таргетинг KIP-поддерева: CQL для /rest/api/content/search вместо всего space.
  # Закомментировано => прежнее поведение (весь space по spaceKey). Значение
  # (id родительской KIP-страницы) подставляется на прогоне.
  confluence_cql: "type=page AND ancestor=50859233"

chunk:
  size: 800
  overlap: 120

retrieval:
  top_k: 8
  rerank_top_k: 5
  max_hops: 3
  # Резерв слотов финального капа под KIP-чанки (chunk:page:*), чтобы полная процедура
  # доходила до генератора цельной. Скромный дефолт 2; 0 = прежнее поведение. Только
  # page-чанки — тикеты/коммиты не затронуты. См. cap_candidates_keep_kip (hybrid.py).
  kip_reserve: 2
  # Окно смежных чанков того же Page, дотягиваемых к выжившему page-чанку (seq +/-N),
  # чтобы разрезанная процедура собралась целиком. 1 = +/-1 сосед (дефолт); 0 = выкл.
  # См. _expand_page_neighbors (hybrid.py).
  kip_neighbors: 1
