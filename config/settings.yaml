# Единый конфиг PoC. Секреты — в .env (см. .env.example), не здесь.

llm:
  # provider: api | ollama  (взаимозаменяемы)
  provider: api
  generation_model: gpt-4o-mini
  extraction_model: gpt-4o-mini
  api_base: https://api.openai.com/v1
  ollama_base: http://localhost:11434
  max_retries: 2
  temperature: 0.0

embeddings:
  # provider: sentence_transformers | hashing (оффлайн/тесты)
  provider: sentence_transformers
  model: BAAI/bge-m3
  dimension: 1024
  device: cpu

reranker:
  # provider: cross_encoder | lexical (оффлайн/тесты)
  provider: cross_encoder
  model: BAAI/bge-reranker-v2-m3

neo4j:
  uri: bolt://localhost:7687
  user: neo4j
  database: neo4j

corpus:
  # Ограниченный срез Kafka
  repo_path: ./data/repos/kafka
  components: [clients, connect, streams]
  since: "2024-01-01"

sources:
  jira_base: https://issues.apache.org/jira
  jira_project: KAFKA
  confluence_base: https://cwiki.apache.org/confluence
  confluence_space: KAFKA
  max_issues: 500
  max_pages: 500
  # Таргетинг KIP-поддерева: CQL для /rest/api/content/search вместо всего space.
  # Закомментировано => прежнее поведение (весь space по spaceKey). Значение
  # (id родительской KIP-страницы) подставляется на прогоне.
  confluence_cql: "type=page AND ancestor=50859233"

chunk:
  size: 800
  overlap: 120

retrieval:
  top_k: 8
  rerank_top_k: 5
  max_hops: 3
  # Резерв слотов финального капа под KIP-чанки (chunk:page:*). Только page-чанки.
  # 0 = обычный top-k (обратная совместимость). Все валидные замеры стека (section +
  # neighbors) сделаны при reserve=0 — прод держим на измеренном конфиге. reserve=2
  # так и не подтверждён (баг раннера дефолтил флаг в 0); чистый A/B 0 vs 2 — в todo.
  kip_reserve: 0
  # Окно смежных чанков того же Page, дотягиваемых к выжившему page-чанку (seq +/-N).
  # ВКЛЮЧЕНО (1): на СЕКЦИОННОМ графе даёт +1.8 п.п. (63.9→65.6, нетто +5), faithfulness
  # держит (0.981→0.978). Соседи и секции дополняют друг друга: сосед секц-чанка — цельный
  # соседний РАЗДЕЛ, а не обрывок. На блёклом графе соседи были wash (+0.4пп) — работает
  # только поверх section-чанкинга. Прежние «−10.7» невалидны. См. _expand_page_neighbors.
  kip_neighbors: 1
  kip_neighbors: 0
